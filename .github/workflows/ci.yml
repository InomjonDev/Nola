name: Walletly checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:goals:db
      - run: npm run pwa:validate
      - run: npm run seo:validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
