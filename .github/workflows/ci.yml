name: Nola checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:goals:db
      - run: npm run pwa:validate
      - run: npm run seo:validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Auth and release smoke on mobile, tablet, and desktop
        run: npx playwright test tests/e2e/email-magic-link.spec.ts tests/e2e/release-smoke.spec.ts
